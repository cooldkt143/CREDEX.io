version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: credex-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credex-web
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=credex_db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - mongodb
    restart: always

volumes:
  mongodb_data:
